# Taxonomie métier française : familles d'outils et de compétences.
#
# Usage (pai/ats/semantic.py) — JAMAIS une preuve à elle seule :
#   1. l'offre demande la FAMILLE (« un CRM ») et un MEMBRE est prouvé (« HubSpot ») → PLAUSIBLE (« correspondance
#      possible ») ;
#   2. l'offre demande un MEMBRE (« Salesforce ») et un AUTRE membre est prouvé (« HubSpot ») → reste NON PROUVÉ ;
#      PAI signale seulement la compétence voisine, à valoriser en entretien, jamais à écrire à la place ;
#   3. le corpus métier regroupe les outils par famille.
# Comparaison normalisée (casse, accents, pluriels simples). Modifier ce fichier ne demande aucun code.
version: 1
families:
  crm:
    label: CRM
    category: [crm, logiciel crm, outil crm, outils crm, gestion de la relation client, customer relationship management]
    members: [hubspot, salesforce, pipedrive, zoho, zoho crm, microsoft dynamics, dynamics 365, sellsy, axonaut, odoo crm,
              monday sales crm, freshsales, zendesk sell, salesforce sales cloud]
