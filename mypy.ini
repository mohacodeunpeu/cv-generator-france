# Typage de PAI (CI : job « Qualité »). Progressif : pas de mode strict, mais tout le paquet `pai` est vérifié
# et doit rester sans erreur. Le greffon pydantic comprend les modèles (valeurs par défaut, alias).
[mypy]
python_version = 3.12
files = pai
ignore_missing_imports = True
plugins = pydantic.mypy
warn_unused_ignores = True
warn_redundant_casts = True
