# Modèles IA par tâche — versionné. Changer un modèle = modifier ce fichier, pas le code.
# PAI est GRATUIT PAR DÉFAUT : fournisseur `local` (Ollama) ou aucun ; les fournisseurs payants sont optionnels.
# Les "artifact_tiers" sont utilisés par PAI Studio (page claude.ai, capacité `sample`) :
#   quick ≈ extraction rapide, default ≈ rédaction, complex ≈ stratégie / critique / jugement.
# Fournisseurs interchangeables. Priorité : Réglages → IA (interface, clés chiffrées en base) → variables
# d'environnement (PAI_AI_PROVIDER, *_API_KEY, *_MODEL) → default_provider ci-dessous → null (sans IA).
version: 4

default_provider: local         # local (Ollama, gratuit ; sans modèle installé = sans IA) | none | claude | gemini | mistral | openai

providers:
  claude:
    tasks:
      extract: claude-haiku-4-5
      analyze_offer: claude-haiku-4-5
      analyze_company: claude-haiku-4-5
      match: claude-sonnet-5
      strategy: claude-opus-5-5
      cv_content: claude-sonnet-5
      cv_fix: claude-sonnet-5
      letter: claude-sonnet-5
      answers: claude-sonnet-5
      critique: claude-opus-5-5
      factuality_judge: claude-opus-5-5
      judge_pair: claude-opus-5-5
      judge_visual: claude-opus-5-5
      learning_rules: claude-sonnet-5
      chat: claude-haiku-4-5
      studio_quick: claude-haiku-4-5      # passerelle PAI Studio (palier rapide)
      studio_default: claude-sonnet-5
      studio_complex: claude-opus-5-5
    # Prix (USD / million de tokens) pour le garde-fou de coût. À ajuster si la grille change.
    pricing_usd_per_mtok:
      claude-opus-5-5: {input: 4.0, output: 20.0}
      claude-sonnet-5: {input: 2.0, output: 10.0}
      claude-haiku-4-5: {input: 1.0, output: 5.0}
    # Capacités par modèle. Opus 5.5 et Sonnet 5 refusent `temperature` (erreur 400) :
    # la stabilité vient de l'effort bas/moyen, des sorties JSON validées et du cache.
    capabilities:
      claude-opus-5-5: {temperature: false, thinking: adaptive, effort: true}
      claude-sonnet-5: {temperature: false, thinking: adaptive, effort: true}
      claude-haiku-4-5: {temperature: true, thinking: none, effort: false}
    effort_by_task:
      strategy: high
      critique: high
      factuality_judge: high
      judge_pair: high
      judge_visual: medium
      match: medium
      cv_content: medium
      cv_fix: medium
      letter: medium
      answers: medium
      learning_rules: medium
  # Fournisseurs compatibles OpenAI (/chat/completions) : un seul modèle pour toutes les tâches.
  # Coût : non chiffré (0 € dans le journal des appels) — le garde-fou de coût ne compte que Claude.
  # Fixer un plafond de dépense dans la console du fournisseur.
  gemini:
    # Google Gemini, point d'accès compatible OpenAI : https://generativelanguage.googleapis.com/v1beta/openai
    # Clé : GEMINI_API_KEY ou Réglages → IA. Modèle : GEMINI_MODEL ou Réglages → IA.
    tasks: {default: "${GEMINI_MODEL:-gemini-2.5-flash}"}
  mistral:
    # Mistral AI (La Plateforme) : https://api.mistral.ai/v1
    # Clé : MISTRAL_API_KEY ou Réglages → IA. Modèle : MISTRAL_MODEL ou Réglages → IA.
    tasks: {default: "${MISTRAL_MODEL:-mistral-large-latest}"}
  openai:
    # API OpenAI (ou compatible : OPENAI_BASE_URL). Le nom du modèle vient de l'environnement (OPENAI_MODEL)
    # ou des Réglages → IA : aucun nom inventé ici.
    tasks: {default: "${OPENAI_MODEL}"}
  local:
    # Ollama ou tout serveur compatible OpenAI (LOCAL_BASE_URL, LOCAL_MODEL, ou Réglages → IA). Coût nul.
    tasks: {default: "${LOCAL_MODEL}"}

artifact_tiers:
  extract: quick
  analyze_offer: quick
  analyze_company: quick
  match: default
  strategy: complex
  cv_content: default
  cv_fix: default
  letter: default
  answers: default
  critique: complex
  factuality_judge: complex
  judge_pair: complex
  judge_visual: complex
  learning_rules: default
  chat: quick

generation:
  temperature: 0.2
  max_retries: 2            # nouvelles tentatives après la première, puis échec propre (FAILED)
  max_tokens:
    default: 4000
    cv_content: 6000
    critique: 5000
    letter: 3000

cost_guard:
  usd_to_eur: 0.92
  eur_per_pack_max: 0.80    # plafond par Application Pack
  eur_per_day_max: 6.00     # plafond journalier
  deep_mode_estimate_calls: 11

modes:
  QUICK:    {steps: [ingest, analyze, match, strategy]}
  STANDARD: {steps: [ingest, analyze, match, strategy, cv, validate, critique, letter, questions, pack], critique_cycles: 1, variants: 1}
  DEEP:     {steps: [ingest, analyze, match, strategy, cv, validate, critique, letter, questions, pack], critique_cycles: 3, variants: 3, visual_qa: true}

# ── AI ROUTER : quelle intelligence pour quelle tâche (pai/ai/router.py) ─────────────────────────────────────
# Niveaux : none (voie déterministe, aucun appel) · small (petit modèle local) · large (grand modèle local, ou le
# fournisseur externe s'il est actif). Les tâches déterministes (parsing, coordonnées, dates, sections, mots-clés
# exacts, factualité, contrôle PDF, scores) n'appellent JAMAIS d'IA et ne figurent pas ici.
# Profils : eco (le moins d'IA possible) · balanced (défaut) · quality (IA partout où elle aide).
router:
  profile: balanced
  local_first: true            # fournisseur externe actif : les petites tâches restent sur le modèle local s'il existe
  tasks:
    default:          {eco: none,  balanced: none,  quality: large}
    extract:          {eco: small, balanced: small, quality: small}
    analyze_offer:    {eco: none,  balanced: small, quality: large}
    analyze_company:  {eco: none,  balanced: small, quality: small}
    match:            {eco: none,  balanced: none,  quality: large}   # la correspondance est calculée (+ sémantique locale)
    strategy:         {eco: none,  balanced: large, quality: large}
    cv_content:       {eco: none,  balanced: none,  quality: large}   # le CV déterministe est 100 % factuel
    cv_fix:           {eco: none,  balanced: large, quality: large}
    letter:           {eco: large, balanced: large, quality: large}
    answers:          {eco: none,  balanced: small, quality: large}
    critique:         {eco: none,  balanced: none,  quality: large}
    factuality_judge: {eco: none,  balanced: none,  quality: none}    # la factualité reste déterministe, toujours
    judge_pair:       {eco: none,  balanced: none,  quality: large}
    judge_visual:     {eco: none,  balanced: none,  quality: none}
    learning_rules:   {eco: none,  balanced: small, quality: large}
    chat:             {eco: small, balanced: small, quality: large}
    # Passerelle PAI Studio sans nom de tâche (ancien client) : niveau déduit du palier demandé.
    studio_quick:     {eco: small, balanced: small, quality: small}
    studio_default:   {eco: large, balanced: large, quality: large}
    studio_complex:   {eco: large, balanced: large, quality: large}
