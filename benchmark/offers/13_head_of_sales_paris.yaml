text: |
  Head of Sales (H/F) — CDI — Paris
  Quartzline, scale-up SaaS (logistique), 150 salariés, recrute son Head of Sales France.

  Missions
  - Manager une équipe de 8 commerciaux (SDR et Account Executives) et la faire grandir.
  - Définir la stratégie commerciale et le plan de prospection grands comptes.
  - Piloter le forecast, le pipeline et les KPI sous Salesforce.
  - Recruter et former les nouveaux commerciaux.

  Profil
  - 10 ans d'expérience minimum dans la vente SaaS B2B, dont 4 ans de management d'équipe.
  - Master ou école de commerce.
  - Maîtrise de Salesforce indispensable.
  - Anglais bilingue.

  Package : 90-110 k€ + variable + BSPCE.
