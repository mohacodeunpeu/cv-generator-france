text: |
  Attaché commercial terrain (H/F) — CDI — Lyon et agglomération
  Sodexa Pro distribue des fournitures et équipements de bureau aux PME de la région Auvergne-Rhône-Alpes.

  Vos missions
  - Développer un secteur géographique : prospection terrain, rendez-vous clients, négociation.
  - Fidéliser un portefeuille existant de 150 clients PME.
  - Atteindre vos objectifs mensuels de chiffre d'affaires.
  - Saisir votre activité dans notre CRM.

  Votre profil
  - Permis B obligatoire (véhicule de fonction fourni).
  - Expérience réussie en vente BtoB, idéalement terrain.
  - Aisance relationnelle, sens de la négociation, rigueur.

  Rémunération : 28 k€ fixe + commissions (45 k€ annuels possibles). Véhicule, téléphone, ordinateur.
