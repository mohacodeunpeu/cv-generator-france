text: |
  Conseiller de vente (H/F) — Maison de maroquinerie — CDI — Paris 8e (boutique Faubourg Saint-Honoré)
  Maison Arlette, maroquinier français fondé en 1921, recherche un conseiller de vente pour sa boutique parisienne.

  Vos responsabilités
  - Offrir une expérience client d'exception à une clientèle locale et internationale.
  - Développer et fidéliser votre clientèle (clienteling, suivi des clients privilégiés).
  - Atteindre vos objectifs individuels de vente.
  - Participer à la mise en valeur des collections en boutique.

  Profil
  - Expérience réussie dans la vente en environnement premium ou luxe.
  - Anglais courant indispensable ; mandarin ou arabe très appréciés.
  - Présentation soignée, sens du service, élégance du discours.
  - Disponibilité le samedi.

  Rémunération attractive (fixe + variable sur objectifs individuels et collectifs).
