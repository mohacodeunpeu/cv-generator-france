text: |
  Chef de projet digital junior (H/F) — CDI — Paris 11e
  Studio Kairn crée des sites vitrines et des landing pages pour des TPE et des marques émergentes.

  Missions
  - Piloter les projets clients de la prise de brief à la mise en ligne.
  - Construire et optimiser des sites sous Wix et WordPress.
  - Améliorer les taux de conversion des landing pages (tests, UX, contenus).
  - Produire des visuels simples (Canva) et coordonner les rédacteurs.

  Profil
  - Première expérience en gestion de projets web.
  - Maîtrise de Wix ; WordPress et notions de SEO appréciés.
  - Sens du client, autonomie, organisation.
  - Anglais lu et écrit.

  32-36 k€ selon profil. Télétravail partiel.
