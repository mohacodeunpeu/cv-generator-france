text: |
  Customer Success Manager (H/F) — CDI — Paris (hybride)
  Plumeo est une plateforme SaaS de gestion des entretiens annuels utilisée par 600 entreprises.

  Tes missions
  - Assurer l'onboarding des nouveaux clients et l'adoption de la plateforme.
  - Suivre la satisfaction (NPS) et réduire le churn de ton portefeuille.
  - Identifier les opportunités d'expansion avec l'équipe commerciale.
  - Animer des business reviews et suivre tes KPI dans HubSpot.

  Ton profil
  - 1 à 3 ans d'expérience en relation client B2B, account management ou customer success.
  - Excellente communication, pédagogie, sens de l'organisation.
  - HubSpot ou autre CRM : requis.
  - Anglais professionnel.

  38-44 k€ + bonus. 3 jours de télétravail.
