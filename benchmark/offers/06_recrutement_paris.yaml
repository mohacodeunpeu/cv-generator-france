text: |
  Chargé de recrutement (H/F) — CDD 12 mois — Paris 10e
  Talentis Intérim, réseau d'agences spécialisées dans les métiers de la logistique et du tertiaire.

  Missions
  - Recueillir les besoins des entreprises clientes et rédiger les annonces.
  - Sourcer les candidats (jobboards, réseaux sociaux, partenaires emploi) et mener les entretiens.
  - Organiser des sessions de recrutement collectives et des job datings.
  - Travailler avec France Travail sur les dispositifs de formation (POEI) : un plus apprécié.
  - Développer la relation avec les entreprises clientes du secteur.

  Profil
  - Bac+2/3 en RH ou commerce.
  - Première expérience en recrutement ou en agence d'emploi.
  - Excellent sens relationnel, organisation, réactivité.
  - Maîtrise des outils bureautiques (Excel).

  Salaire : 30 k€ annuel brut + primes. Démarrage immédiat.
