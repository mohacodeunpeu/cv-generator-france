  Client Relations Executive — French speaker — London — Permanent
  Hartwell & Finch is a luxury concierge company serving private clients across Europe.

  Responsibilities
  - Be the first point of contact for French-speaking private clients (phone, email, chat).
  - Handle requests end to end: reservations, gifts, travel arrangements.
  - Build long-term relationships and anticipate client needs.
  - Keep client records accurate in our CRM.

  Requirements
  - Native French and fluent English are essential.
  - Experience in premium retail, hospitality or client services.
  - Outstanding service mindset, discretion and organisation.
  - Arabic or Spanish would be an advantage.

  Salary: £30,000–£34,000. Hybrid after probation.
