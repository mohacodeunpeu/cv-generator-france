  Chargé(e) d'événementiel (H/F) — CDD 6 mois — Paris 7e
  L'Hôtel Le Mirador (5 étoiles, 90 chambres) développe son activité séminaires et réceptions privées.

  Missions
  - Accueillir les demandes, construire les propositions et suivre les réservations d'événements.
  - Coordonner les équipes internes (banquets, cuisine, technique) et les prestataires.
  - Assurer l'accueil des clients le jour J et le suivi après l'événement.
  - Contribuer à la fidélisation de la clientèle entreprises.

  Profil
  - Première expérience en hôtellerie, événementiel ou vente premium.
  - Anglais courant ; une troisième langue est un atout.
  - Sens de l'accueil, organisation, gestion du stress.

  Horaires variables selon les événements. Salaire selon profil.
