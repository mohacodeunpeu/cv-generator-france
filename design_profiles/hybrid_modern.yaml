# Design par défaut : une colonne (ordre de lecture ATS garanti), bandeau d'en-tête sobre.
id: hybrid_modern
name: Hybride moderne
version: 2
ats_safe: true
layout: single_column          # single_column | two_column
header: band                   # band | plain
photo_modes: [OFF, HEADER]
colors:
  ink: "#16202A"
  muted: "#55606B"
  accent: "#1C5D7A"
  accent2: "#9A6A2F"
  rule: "#D5DBE0"
  band: "#EEF2F5"
